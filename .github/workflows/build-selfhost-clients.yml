name: Build self-host clients

# Run from the homelab branch with: git tag clients-N && git push origin clients-N
on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build the Android release APK
        type: boolean
        default: true
      build_linux:
        description: Build the Linux release bundle
        type: boolean
        default: true
      build_windows:
        description: Build the Windows release bundle
        type: boolean
        default: true
  push:
    tags:
      - 'clients-*'

permissions:
  contents: read

concurrency:
  group: build-selfhost-clients
  cancel-in-progress: true

jobs:
  check-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require self-host repository variables
        env:
          POMODOIST_RELEASE: ${{ vars.POMODOIST_RELEASE }}
          WEB_APP_URL: ${{ vars.POMODOIST_WEB_URL }}
          SUPABASE_URL: ${{ vars.POMODOIST_API_URL }}
          SUPABASE_ANON_KEY: ${{ vars.POMODOIST_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in POMODOIST_RELEASE WEB_APP_URL SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "The following repository variables are empty: ${missing[*]}." >&2
            echo 'Set vars.POMODOIST_RELEASE, vars.POMODOIST_WEB_URL, vars.POMODOIST_API_URL and vars.POMODOIST_ANON_KEY before running this workflow.' >&2
            exit 1
          fi

  android:
    needs: check-config
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/flutter
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_STORE_PASSWORD" ] &&
             [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-selfhost.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-selfhost.jks"
              echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo 'WARNING: ANDROID_KEYSTORE_* secrets are not all set.' >&2
            echo 'WARNING: Release Gradle wiring rejects the platform debug keystore, so this job generates a disposable upload key for this run only.' >&2
            echo 'WARNING: Sideload upgrades require the same signing key on every build; configure the four ANDROID_* secrets for stable signing.' >&2
            umask 077
            password=$(openssl rand -hex 24)
            echo "::add-mask::$password"
            export CI_KEY_PASSWORD="$password"
            keytool -genkeypair -noprompt -storetype JKS -keyalg RSA -keysize 2048 \
              -validity 825 -alias pomodoist-selfhost-ci -dname 'CN=Pomodoist Self-Host CI' \
              -keystore "$RUNNER_TEMP/android-selfhost-ci.jks" \
              -storepass:env CI_KEY_PASSWORD -keypass:env CI_KEY_PASSWORD
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-selfhost-ci.jks"
              echo "ANDROID_STORE_PASSWORD=$password"
              echo 'ANDROID_KEY_ALIAS=pomodoist-selfhost-ci'
              echo "ANDROID_KEY_PASSWORD=$password"
            } >> "$GITHUB_ENV"
          fi
      - name: Build Android release APK
        working-directory: apps/flutter
        env:
          POMODOIST_RELEASE: ${{ vars.POMODOIST_RELEASE }}
          WEB_APP_URL: ${{ vars.POMODOIST_WEB_URL }}
          SUPABASE_URL: ${{ vars.POMODOIST_API_URL }}
          SUPABASE_ANON_KEY: ${{ vars.POMODOIST_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build apk --release --flavor production --target lib/main.dart \
            --dart-define=POMODOIST_ENVIRONMENT=selfhosted \
            --dart-define=POMODOIST_RELEASE="$POMODOIST_RELEASE" \
            --dart-define=WEB_APP_URL="$WEB_APP_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=POMODOIST_BILLING_CHANNEL=stripe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pomodoist-android-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-production-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove Android signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-selfhost.jks" "$RUNNER_TEMP/android-selfhost-ci.jks"

  linux:
    needs: check-config
    if: github.event_name != 'workflow_dispatch' || inputs.build_linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libcurl4-openssl-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/flutter
      - name: Build Linux release bundle
        working-directory: apps/flutter
        env:
          POMODOIST_RELEASE: ${{ vars.POMODOIST_RELEASE }}
          WEB_APP_URL: ${{ vars.POMODOIST_WEB_URL }}
          SUPABASE_URL: ${{ vars.POMODOIST_API_URL }}
          SUPABASE_ANON_KEY: ${{ vars.POMODOIST_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build linux --release --flavor production --target lib/main.dart \
            --dart-define=POMODOIST_ENVIRONMENT=selfhosted \
            --dart-define=POMODOIST_RELEASE="$POMODOIST_RELEASE" \
            --dart-define=WEB_APP_URL="$WEB_APP_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=POMODOIST_BILLING_CHANNEL=stripe
      - name: Package Linux bundle
        run: |
          set -euo pipefail
          bundle_root=apps/flutter/build/linux/x64/production/release/bundle
          test -d "$bundle_root"
          tar -czf pomodoist-linux-x64.tar.gz -C "$bundle_root" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pomodoist-linux-x64
          path: pomodoist-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: check-config
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/flutter
      - name: Build Windows release bundle
        working-directory: apps/flutter
        env:
          POMODOIST_RELEASE: ${{ vars.POMODOIST_RELEASE }}
          WEB_APP_URL: ${{ vars.POMODOIST_WEB_URL }}
          SUPABASE_URL: ${{ vars.POMODOIST_API_URL }}
          SUPABASE_ANON_KEY: ${{ vars.POMODOIST_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build windows --release --flavor production --target lib/main.dart \
            --dart-define=POMODOIST_ENVIRONMENT=selfhosted \
            --dart-define=POMODOIST_RELEASE="$POMODOIST_RELEASE" \
            --dart-define=WEB_APP_URL="$WEB_APP_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=POMODOIST_BILLING_CHANNEL=stripe
      - name: Package Windows bundle
        shell: pwsh
        run: |
          $releaseDir = Resolve-Path 'apps/flutter/build/windows/x64/production/runner/Release'
          $zipPath = Join-Path $env:RUNNER_TEMP 'pomodoist-windows-x64.zip'
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zipPath
          Copy-Item -LiteralPath $zipPath -Destination 'pomodoist-windows-x64.zip'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pomodoist-windows-x64
          path: pomodoist-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
