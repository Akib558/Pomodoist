name: Publish images

on:
  push:
    branches:
      - homelab
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: shared-postgres
            context: server
            dockerfile: server/docker/db/Dockerfile
            primary_tag: "17"
            build_args: ""
          - image: pomodoist-migrate
            context: server
            dockerfile: server/docker/migrate/Dockerfile
            primary_tag: latest
            build_args: ""
          - image: pomodoist-gateway
            context: server
            dockerfile: server/docker/gateway/Dockerfile
            primary_tag: latest
            build_args: ""
          - image: pomodoist-functions
            context: server
            dockerfile: server/docker/functions/Dockerfile
            primary_tag: latest
            build_args: ""
          - image: pomodoist-web
            context: .
            dockerfile: tool/deploy/web/Dockerfile
            primary_tag: latest
            # RELEASE_SHA must equal POMODOIST_RELEASE in the Komodo stack environment.
            build_args: |
              POMODOIST_BILLING_CHANNEL=stripe
              RELEASE_SHA=${{ vars.POMODOIST_RELEASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate POMODOIST_RELEASE for web image
        if: matrix.image == 'pomodoist-web'
        env:
          POMODOIST_RELEASE: ${{ vars.POMODOIST_RELEASE }}
        run: |
          if [ -z "$POMODOIST_RELEASE" ]; then
            echo "::error::vars.POMODOIST_RELEASE is empty; set a 40-character lowercase hex release id in repository variables."
            exit 1
          fi
          if ! printf '%s' "$POMODOIST_RELEASE" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::vars.POMODOIST_RELEASE must be exactly 40 lowercase hex characters (got: ${POMODOIST_RELEASE})"
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/akib558/${{ matrix.image }}:${{ matrix.primary_tag }}
            ghcr.io/akib558/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: ${{ matrix.build_args }}
