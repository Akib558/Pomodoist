<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoist — комментарии в быстром вводе</title>
<style>
:root{font-family:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#fafafa;font-synthesis:none;--red:#d83b2e;--line:#e5e5e5;--muted:#737373;--soft:#fdecea}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:3px}button{color:inherit}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}header{max-width:1140px;margin:auto;padding:52px 32px 28px}small,.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}h1{font-size:34px;font-weight:550;letter-spacing:-1.2px;margin:14px 0 12px}header p{font-size:15px;color:var(--muted);margin:0;line-height:1.6}.toolbar{max-width:1076px;margin:0 auto 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.switch{display:flex;background:#eee;padding:4px;border-radius:10px;gap:2px}.switch button{border:0;background:none;padding:10px 16px;border-radius:7px;font-size:13px;min-height:40px}.switch button[aria-pressed=true]{background:white;box-shadow:0 1px 3px #0000000d}.hint{font-size:12px;color:var(--muted)}main{max-width:1140px;padding:0 32px 64px;margin:auto}article{border-top:1px solid var(--line);padding:30px 0 36px;scroll-margin:24px}.caption{display:flex;gap:20px;align-items:baseline;margin-bottom:22px}.number{font-size:13px;color:#aaa;font-variant-numeric:tabular-nums}h2{font-size:20px;letter-spacing:-.4px;font-weight:550;margin:0}.caption p{font-size:13px;color:var(--muted);margin:7px 0 0;line-height:1.5}.recommend{font-size:11px;border:1px solid #eacac6;color:#a73a30;padding:4px 8px;border-radius:5px;margin-left:10px;vertical-align:middle;white-space:nowrap}.stage{padding:28px;background:#f1f1ef;border-radius:12px;min-height:220px;display:flex;align-items:flex-start;justify-content:center}.composer{width:100%;max-width:900px;background:white;border:1px solid #dededb;border-radius:10px;position:relative;min-width:0}.title-row{display:flex;align-items:center;gap:12px;padding:16px}.title-row>svg{color:var(--muted)}.title-input{flex:1;min-width:0;font-size:19px;line-height:1.5;border:0;background:transparent;padding:6px 0;width:100%}.title-input:focus{outline:none;box-shadow:0 1px var(--red)}.tools{display:flex;align-items:center;gap:4px}.icon{display:inline-flex;justify-content:center;align-items:center;min-width:40px;height:40px;background:transparent;border:0;border-radius:8px;color:var(--muted)}.icon:hover{background:#f5f5f5}.trigger[aria-expanded=true],.mode[aria-pressed=true]{color:var(--red);background:var(--soft)}.footer{display:flex;align-items:center;gap:8px;padding:0 12px 12px;flex-wrap:wrap}.chip{border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 12px;border-radius:8px;font-size:14px;white-space:nowrap;background:white}.metadata{color:var(--red)}.chip svg{width:17px;height:17px}.trigger{color:var(--muted)}.add{margin-left:auto;background:var(--red);color:white;border:0;border-radius:8px;min-height:40px;padding:8px 14px;display:flex;align-items:center;gap:8px}.editor{margin:0 16px 16px;padding:12px;background:#f7f7f6;border-radius:8px}.editor textarea{display:block;resize:vertical;min-height:64px;width:100%;border:0;background:transparent;line-height:1.5;font-size:14px;padding:4px;color:#333}.editor textarea:focus{outline:1px solid var(--red);outline-offset:4px;border-radius:3px}.editor textarea::placeholder{color:#8b8b8b}.editor-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-bottom:7px}.editor-label svg{width:15px;height:15px}.editor-label .icon{margin-left:auto;height:28px;min-width:28px}.v2 .editor{border-left:2px solid #d9a49e;border-radius:0;background:white;margin-left:48px;padding:0 12px}.v3 .stage{min-height:320px}.v3 .editor{position:absolute;z-index:1;right:12px;top:calc(100% + 8px);width:340px;max-width:calc(100% - 24px);background:white;border:1px solid var(--line);box-shadow:0 8px 24px #0000000a;margin:0}.v3 .editor:before{content:"";position:absolute;width:10px;height:10px;border-left:1px solid var(--line);border-top:1px solid var(--line);background:white;top:-6px;right:30px;transform:rotate(45deg)}.tabs{display:flex;padding:10px 16px 0;gap:4px}.mode{border:0;background:transparent;border-radius:6px;min-height:40px;padding:8px 12px;font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:center}.mode svg{width:16px;height:16px}.v4 .editor{margin-top:14px;background:white;min-height:78px}.v4 .editor textarea{font-size:17px}.summary{font-size:12px;color:var(--muted);padding:12px 16px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v5 .strip{width:100%;border:0;border-top:1px solid var(--line);border-radius:0 0 10px 10px;display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fafafa;min-height:44px;text-align:left;font-size:13px}.strip svg:last-child{margin-left:auto;width:16px}.v5 .editor{margin:0;background:#fafafa;border-radius:0 0 10px 10px;border-top:1px solid var(--line);padding:16px}.mobile-heading{display:none}.bottom-mic{display:none}[hidden]{display:none!important}.context-window .composer{max-width:700px;box-shadow:0 6px 18px #00000005}.context-window .footer{border-top:1px solid var(--line);padding-top:12px}.context-mobile .composer{max-width:380px;border-radius:12px 12px 0 0}.context-mobile .stage{min-height:410px;padding:24px}.context-mobile .mobile-heading{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0;font-size:13px;color:var(--muted)}.context-mobile .title-row{padding:12px 16px;gap:8px}.context-mobile .title-input{font-size:17px}.context-mobile .title-row>svg,.context-mobile .tools>.mic{display:none}.context-mobile .icon,.context-mobile .chip{min-width:48px;min-height:48px}.context-mobile .footer{padding:0 16px 16px;gap:6px}.context-mobile .chip{font-size:12px;padding:8px}.context-mobile .add{min-height:48px;flex:1}.context-mobile .bottom-mic{display:inline-flex;border:1px solid var(--line)}.context-mobile .action-break{flex-basis:100%;height:0}.context-mobile .v3 .stage{min-height:570px}.context-mobile .v3 .editor{width:auto;left:0;right:0;max-width:none;top:calc(100% + 8px);border-radius:12px 12px 0 0}.context-mobile .v3 .editor:before{display:none}.context-mobile .v2 .editor{margin-left:20px}.context-mobile .v4 .editor{min-height:80px}.context-mobile .v5 .strip{min-height:48px}.context-mobile .tabs{flex-wrap:wrap}.context-mobile .mode{min-height:48px}.context-mobile .editor-label .icon{min-width:36px;min-height:36px}.page-footer{font-size:12px;color:#888;margin-top:24px}@media(max-width:700px){header{padding:32px 20px 24px}h1{font-size:28px}.toolbar{padding:0 20px}.switch{flex-wrap:wrap}.switch button{padding:8px 12px}main{padding:0 16px 40px}.stage{padding:16px}.caption{gap:12px}.caption h2{font-size:18px}.recommend{display:inline-block;margin:8px 0 0}.title-input{font-size:16px}.title-row{padding:12px;gap:6px}.tools{gap:0}.title-row>svg{display:none}.footer{gap:6px}.chip{font-size:12px;padding:8px}.context-mobile .stage{padding:16px}.toolbar .hint{display:none}}
</style>
<body class="context-inline">
<header><div class="eyebrow">Pomodoist / быстрый ввод</div><h1>Место для комментария</h1><p>Пять набросков. Одна задача, пять способов добавить контекст.</p></header>
<div class="toolbar"><div class="switch" aria-label="Формат быстрого ввода"><button data-context="inline" aria-pressed="true">В списке</button><button data-context="window" aria-pressed="false">Диалог / окно</button><button data-context="mobile" aria-pressed="false">Телефон</button></div><span class="hint">Нажмите кнопку комментария · поля доступны для ввода</span></div>
<main id="variants"></main>
<script>
const paths={comment:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-3 2v-9.5A8.5 8.5 0 0 1 9.5 4h3a8.5 8.5 0 0 1 8.5 7.5Z"/><path d="M7 10h9M7 14h6"/>',list:'<path d="M3 6h12M3 12h9M3 18h12M19 9v6M16 12h6"/>',calendar:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',flag:'<path d="M5 21V3c5-4 9 4 14 0v10c-5 4-9-4-14 0"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M9 22h6"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',chevron:'<path d="m7 14 5-5 5 5"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
const concepts=[
['Чип рядом с параметрами','Комментарий раскрывается под задачей. Самое привычное место.'],
['Иконка у текста','Кнопка рядом с названием. Комментарий становится его второй строкой.'],
['Всплывающая карточка','Отдельное маленькое поле. На телефоне — панель под вводом.'],
['Задача / комментарий','Два режима одного поля. Компактно даже в маленьком окне.'],
['Нижняя полоса','Комментарий отделён от параметров и раскрывается вниз.']
];
const trigger=(n,kind='chip')=>`<button class="trigger ${kind}" aria-expanded="true" aria-controls="editor-${n}" aria-label="Комментарий" title="Комментарий">${icon('comment')}${kind==='chip'?'Комментарий':''}${kind==='strip'?'Комментарий'+icon('chevron'):''}</button>`;
for(let n=1;n<=5;n++){
const editor=`<div class="editor" id="editor-${n}"><div class="editor-label">${icon('comment')}Комментарий<button class="icon collapse" aria-label="Свернуть комментарий">${icon('close')}</button></div><textarea aria-label="Комментарий к задаче, вариант ${n}" placeholder="Взять оригиналы и копии…"></textarea></div>`;
const title=`<div class="title-row">${icon('list')}<input class="title-input" aria-label="Название задачи, вариант ${n}" value="Подготовить документы сегодня"><div class="tools">${n===2?trigger(n,'icon'):''}<span class="icon mic" aria-label="Микрофон (эскиз)">${icon('mic')}</span></div></div>`;
const footer=`<div class="footer"><span class="chip metadata">${icon('calendar')}29 сент.</span><span class="chip metadata"># &nbsp;Близкие</span><span class="chip metadata">${icon('flag')}P4</span>${n===1?trigger(n):''}${n===3?trigger(n,'icon'):''}<span class="action-break"></span><span class="icon bottom-mic">${icon('mic')}</span><span class="add">${icon('plus')}Добавить</span></div>`;
const tabs=`<div class="tabs"><button class="mode" data-mode="task" aria-pressed="false">${icon('list')}Задача</button><button class="mode" data-mode="comment" aria-pressed="true">${icon('comment')}Комментарий</button></div><div class="summary">Подготовить документы сегодня</div>`;
const article=document.createElement('article');article.className=`v${n}`;article.id=`variant-${n}`;
article.innerHTML=`<div class="caption"><span class="number">0${n}</span><div><h2>${concepts[n-1][0]}${n===1?'<span class="recommend">Мой выбор</span>':''}</h2><p>${concepts[n-1][1]}</p></div></div><div class="stage"><div class="composer"><div class="mobile-heading"><span>Новая задача</span><span aria-hidden="true">×</span></div>${n===4?tabs:''}${title}${n===2||n===4?editor:''}${footer}${n===1||n===3?editor:''}${n===5?trigger(n,'strip')+editor:''}</div></div>`;
document.querySelector('main').append(article);
if(n===4)article.querySelector('.title-row').hidden=true;
}
function setOpen(article,open){
article.querySelector('.editor').hidden=!open;
article.querySelectorAll('.trigger').forEach(b=>b.setAttribute('aria-expanded',String(open)));
if(article.classList.contains('v4')){
article.querySelector('.title-row').hidden=open;article.querySelector('.summary').hidden=!open;
article.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.mode==='comment')===open)));
}
}
document.addEventListener('click',event=>{
const context=event.target.closest('[data-context]');
if(context){document.body.className=`context-${context.dataset.context}`;document.querySelectorAll('[data-context]').forEach(b=>b.setAttribute('aria-pressed',String(b===context)));return;}
const control=event.target.closest('.trigger,.collapse,.mode');if(!control)return;
const article=control.closest('article');const open=control.matches('.collapse')?false:control.matches('.mode')?control.dataset.mode==='comment':article.querySelector('.editor').hidden;
setOpen(article,open);
if(open)article.querySelector('textarea').focus();else (article.querySelector('.trigger')||article.querySelector('[data-mode=task]')).focus();
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&event.target.matches('textarea')){const article=event.target.closest('article');setOpen(article,false);(article.querySelector('.trigger')||article.querySelector('[data-mode=task]')).focus();}});
</script>
</body>
</html>
